<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>API Test - No Blockers</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 600px; margin: 0 auto; padding: 20px; }
        button { background: #007bff; color: white; border: none; padding: 12px 24px; border-radius: 6px; font-size: 16px; cursor: pointer; margin: 10px 0; }
        button:disabled { background: #ccc; }
        .result { background: #f8f9fa; padding: 15px; margin: 10px 0; border-radius: 8px; white-space: pre-wrap; }
        .error { background: #f8d7da; color: #721c24; }
        .success { background: #d4edda; color: #155724; }
    </style>
</head>
<body>
    <h1>Direct API Test (No GitHub Pages)</h1>
    
    <button id="testBtn" onclick="testDirectAPI()">Test Google AI API Directly</button>
    
    <div id="result"></div>
    
    <script type="module">
        // Direct API test without build system complications
        const API_KEY = 'AIzaSyB_du5hg25tbgS-v2cApWivi3_BQQeZb5k';
        
        window.testDirectAPI = async function() {
            const resultDiv = document.getElementById('result');
            const btn = document.getElementById('testBtn');
            
            btn.disabled = true;
            btn.textContent = 'Testing...';
            resultDiv.innerHTML = 'Testing Google AI API connection...';
            
            try {
                console.log('Testing direct fetch to Google AI API...');
                
                const response = await fetch('https://generativelanguage.googleapis.com/v1beta/models/gemini-2.0-flash-exp:generateContent?key=' + API_KEY, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        contents: [{
                            parts: [{
                                text: 'Say "API connection successful" if you can read this.'
                            }]
                        }]
                    })
                });
                
                console.log('Response status:', response.status);
                console.log('Response headers:', Object.fromEntries(response.headers.entries()));
                
                if (!response.ok) {
                    throw new Error(`HTTP ${response.status}: ${response.statusText}`);
                }
                
                const data = await response.json();
                console.log('API Response:', data);
                
                resultDiv.className = 'result success';
                resultDiv.textContent = `SUCCESS! API is working.\n\nResponse: ${JSON.stringify(data, null, 2)}`;
                
            } catch (error) {
                console.error('API Test failed:', error);
                resultDiv.className = 'result error';
                resultDiv.textContent = `FAILED: ${error.message}\n\nThis confirms the blocker is preventing API calls.`;
            } finally {
                btn.disabled = false;
                btn.textContent = 'Test Google AI API Directly';
            }
        };
    </script>
    
    <hr>
    <h3>If this fails:</h3>
    <ol>
        <li>Try in Incognito/Private mode</li>
        <li>Disable browser extensions temporarily</li>
        <li>Check browser privacy settings</li>
        <li>Try a different browser</li>
    </ol>
</body>
</html>
